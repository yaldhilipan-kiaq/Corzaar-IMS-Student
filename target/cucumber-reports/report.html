 courses page after selecting free course\n    When User clicks the Filter & Sort option to select course by rating\n    And User clicks \"\x3Crating>\" for the Course \n    And User clicks the Apply Filter to filter the course\n    Then Courses are displayed for selected rating\n\n    Examples:\n      | rating   |\n      | 4.5★ + |\n  \n  Scenario: Verify User can search course by mode\n    Given User is on the courses page after selecting the rating\n    When User clicks the Filter & Sort option to select mode\n    And User clicks \"\x3Cmode>\" Course Only\n    And User clicks the Apply Filter to select mode of the  course\n    Then Courses are displayed for selected mode\n\n    Examples:\n      | mode   |\n      | Online |\n\n\n  Scenario: Verify User can sort course by using filters\n    Given User is on the courses page after selecting mode\n    When User clicks the Filter & Sort option to sort\n    And User clicks \"\x3Csort>\" Course\n    And User clicks the Apply Filter to sort the  course\n    Then Courses are displayed for applied filter\n\n    Examples:\n      | sort    |\n      | Price ↑ |\n","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"uri":"classpath:Features/2.Filter.feature","feature":{"location":{"line":2,"column":1},"tags":[{"location":{"line":1,"column":1},"name":"@student","id":"2ed983ed-d068-41ad-a7a2-0b7d693836a6"}],"language":"en","keyword":"Feature","name":"CORZAAR IMS Mobile Application","description":"","children":[{"scenario":{"location":{"line":5,"column":3},"tags":[],"keyword":"Scenario","name":"Verify user can search valid course through Search Option","description":"","steps":[{"location":{"line":6,"column":5},"keyword":"Given ","keywordType":"Context","text":"User Clicks course option to search course","id":"7a0207de-00a4-41b4-8cc4-478b8aadafdf"},{"location":{"line":7,"column":5},"keyword":"When ","keywordType":"Action","text":"User enters  Course \"\x3CcourseName>\" name","id":"d67b873a-b535-4c30-86bf-6dacb89362
