    Then Courses are displayed for selected category\n\n    Examples:\n      | category   |\n      | Technology |\n\n  Scenario: Verify User can search course by Duration\n    Given User is on the courses page after selecting category\n    When User clicks the Filter & Sort option for duration\n    And User clicks \"\x3Cmonths>\"month\n    And User clicks the Apply Filter\n    Then Courses are displayed for selected duration\n\n    Examples:\n      | months      |\n      | 1 -3 months |\n\n  Scenario: Verify User can search course by Free\n    Given User is on the courses page after selecting Duration\n    When User clicks the Filter & Sort option for free course\n    And User clicks Free Course Only\n    And User clicks the Apply Filter to select free course\n    Then Courses are displayed\n\n\n@rating\n  Scenario: Verify User can search course by rating\n    Given User is on the courses page after selecting free course\n    When User clicks the Filter & Sort option to select course by rating\n    And User clicks \"\x3Crating>\" for the Course \n    And User clicks the Apply Filter to filter the course\n    Then Courses are displayed for selected rating\n\n    Examples:\n      | rating   |\n      | Any |\n  @mode\n  Scenario: Verify User can search course by mode\n    Given User is on the courses page after selecting the rating\n    When User clicks the Filter & Sort option to select mode\n    And User clicks \"\x3Cmode>\" Course Only\n    And User clicks the Apply Filter to select mode of the  course\n    Then Courses are displayed for selected mode\n\n    Examples:\n      | mode   |\n      | Online |\n\n  @sortby\n  Scenario: Verify User can sort course by using filters\n    Given User is on the courses page after selecting mode\n    When User clicks the Filter & Sort option to sort\n    And User clicks \"\x3Csort>\" Course\n    And User clicks the Apply Filter to sort the  course\n    Then Courses are displayed for applied filter\n\n    Examples:\n      | sort    |\n      | Price ↑ |\n","mediaType":"text/x.cucumber.gherkin+plain"}},{"gherkinDocument":{"uri":"classpath:Features/2.Filter.feature","feature":{"location":{"line":1,"column":1},"tags":[],"language":"en","keyword":"Feature","name":"CORZAAR IMS Mobile Application","description":"","children":[{"scenario":{"location":{"line":4,"column":3},"tags":[{"location":{"line":3,"column":3},"name":"@searchcourse","id":"ca3302b0-e0cb-4d56-884a-122db46be500"}],"keyword":"Scenario","name":"Verify user can search valid course through Search Option","description":"","steps":[{"location":{"line":5,"column":5},"keyword":"Given ","keywordType":"Context","text":"User Clicks course option to search course","id":"07fb9e2f-b668-496c-bae6-5b577d7c3aea"},{"location":{"line":6,"column":5},"keyword":"When ","keywordType":"Action","text":"User enters  Course \"\x3CcourseName>\" name","id":"d810f000-50bc-4e2a-a2ee-9d06019da503"},{"location":{"line":7,"column":5},"keyword":"And ","keywordType":"Conjunction","text":"User Clicks the Search button for valid course","id":"be2ae49c-17f0-4050-8ded-b0524aad303e"},{"location":{"line":8,"column":5},"keyword":"Then ","keywordType":"Outcome","text":"Search Result should be \"\x3Cresult>\"","id":"337806e0-ac25-460a-9d0e-9923cc3e765d"}],"examples":[{"location":{"line":10,"column":5},"tags":[],"keyword":"Examples","name":"","description":"","tableHeader":{"location":{"line":11,"column":7},"cells":[{"location":{"line":11,"column":9},"value":"courseName"},{"location":{"line":11,"column":37},"value":"result"}],"id":"484a1470-f22d-4459-9003-e939885481a1"},"tableBody":[{"location":{"line":12,"column":7},"cells":[{"location":{"line":12,"column":9},"value":"UI UX Design Fundamentals"},{"location":{"line":12,"column":37},"value":"displayed"}],"id":"06adcdc1-1d7f-4713-8801-11f33bb4bb3b"}],"id":"5b662a9a-da92-43ef-bfdb-5b758a6d003f"}],"id":"a8a35897-32f2-45b8-b5f6-b6802f43afa4"}},{"scenario":{"location":{"line":14,"column":3},"tags":[],"keyword":"Scenario","name":"Veri
